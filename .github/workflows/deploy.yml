name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

env:
  IMAGE_NAME: skywoop-api

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Resolve Azure targets
        id: azure
        run: |
          set -euo pipefail
          RG="${AZURE_RESOURCE_GROUP:-}"
          ACR="${ACR_NAME:-}"
          APP="${CONTAINER_APP_NAME:-skywoop-api}"

          if [[ -z "${RG}" ]]; then
            echo "AZURE_RESOURCE_GROUP secret/var is required" >&2
            exit 1
          fi
          if [[ -z "${ACR}" ]]; then
            echo "ACR_NAME secret/var is required" >&2
            exit 1
          fi

          LOGIN_SERVER="$(az acr show -n "${ACR}" -g "${RG}" --query loginServer -o tsv)"
          echo "resource_group=${RG}" >> "$GITHUB_OUTPUT"
          echo "acr_name=${ACR}" >> "$GITHUB_OUTPUT"
          echo "login_server=${LOGIN_SERVER}" >> "$GITHUB_OUTPUT"
          echo "container_app=${APP}" >> "$GITHUB_OUTPUT"
          echo "image=${LOGIN_SERVER}/${IMAGE_NAME}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
        env:
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          ACR_NAME: ${{ vars.ACR_NAME }}
          CONTAINER_APP_NAME: ${{ vars.CONTAINER_APP_NAME }}

      - name: Log in to ACR
        run: az acr login --name "${{ steps.azure.outputs.acr_name }}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ steps.azure.outputs.image }}
            ${{ steps.azure.outputs.login_server }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Update Container App
        id: rollout
        run: |
          set -euo pipefail
          # Pin the new digest so a reused tag still creates a revision.
          IMAGE="${{ steps.azure.outputs.login_server }}/${IMAGE_NAME}@${{ steps.build.outputs.digest }}"
          az containerapp update \
            --name "${{ steps.azure.outputs.container_app }}" \
            --resource-group "${{ steps.azure.outputs.resource_group }}" \
            --image "${IMAGE}" \
            --output none
          REV="$(az containerapp show \
            -g "${{ steps.azure.outputs.resource_group }}" \
            -n "${{ steps.azure.outputs.container_app }}" \
            --query properties.latestRevisionName -o tsv)"
          echo "revision=${REV}" >> "$GITHUB_OUTPUT"
          echo "Rolled out ${REV}"

      - name: Wait for revision
        run: |
          set -euo pipefail
          REV="${{ steps.rollout.outputs.revision }}"
          RG="${{ steps.azure.outputs.resource_group }}"
          APP="${{ steps.azure.outputs.container_app }}"
          for i in $(seq 1 40); do
            LINE="$(az containerapp revision show -g "${RG}" -n "${APP}" --revision "${REV}" \
              --query "[properties.healthState, properties.runningState]" -o tsv || true)"
            HEALTH="$(printf '%s\n' "${LINE}" | awk 'NR==1{print}')"
            RUNNING="$(printf '%s\n' "${LINE}" | awk 'NR==2{print}')"
            echo "attempt ${i}: health=${HEALTH:-pending} running=${RUNNING:-pending}"
            if [[ "${HEALTH}" == "Healthy" && "${RUNNING}" == "Running" ]]; then
              exit 0
            fi
            case "${HEALTH}${RUNNING}" in
              *Failed*|*Degraded*|*ActivationFailed*)
                az containerapp logs show -g "${RG}" -n "${APP}" --revision "${REV}" --tail 80 || true
                exit 1
                ;;
            esac
            sleep 10
          done
          az containerapp logs show -g "${RG}" -n "${APP}" --revision "${REV}" --tail 80 || true
          exit 1

      - name: Health check api.skywoop.com
        run: |
          set -euo pipefail
          for i in $(seq 1 20); do
            if CODE="$(curl -sS -m 15 -o /tmp/skywoop-healthz.body -w '%{http_code}' https://api.skywoop.com/healthz)" \
              && [[ "${CODE}" == "200" ]]; then
              echo "ok (${CODE}) $(tr -d '\n' </tmp/skywoop-healthz.body)"
              exit 0
            fi
            echo "attempt ${i}: HTTP ${CODE:-none}"
            sleep 5
          done
          echo "error: health check failed" >&2
          exit 1
