[package]
name = "skywoop"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"

[dependencies]
anyhow = "1"
thiserror = "2"
async-trait = "0.1"
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["macros", "multipart"] }
tower-http = { version = "0.7", features = ["trace", "request-id", "limit", "cors"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.9", features = [
    "runtime-tokio",
    "tls-rustls",
    "postgres",
    "uuid",
    "chrono",
    "json",
    "migrate",
    "macros",
] }
reqwest = { version = "0.13", default-features = false, features = ["json", "multipart", "form", "stream", "rustls"] }
uuid = { version = "1", features = ["v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
clap = { version = "4", features = ["derive", "env"] }
utoipa = { version = "6", features = ["axum_extras", "chrono", "uuid"] }
utoipa-axum = "0.3"
schemars = "1"
minijinja = "2"
governor = "0.10"
jsonwebtoken = { version = "11", features = ["rust_crypto", "use_pem"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
base64 = "0.22"
flate2 = "1"
csv = "1"
sha2 = "0.10"
hex = "0.4"
hmac = "0.12"
rand = "0.9"
url = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
opentelemetry = "0.33"
opentelemetry_sdk = { version = "0.33", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.33", features = ["grpc-tonic"] }
tracing-opentelemetry = "0.34"
azure_core = "1"
azure_identity = "1"
azure_storage_blob = "1"
azure_storage_common = "1"
azure_storage_sas = "1"
azure_security_keyvault_secrets = "1"
futures-util = "0.3"
bytes = "1"
dotenvy = "0.15"
regex = "1"
scraper = "0.24"
quick-xml = { version = "0.37", features = ["serialize"] }

[dev-dependencies]
wiremock = "0.6"
tokio = { version = "1", features = ["full", "test-util"] }
tempfile = "3"

[profile.dev]
# Faster incremental builds while iterating
incremental = true
